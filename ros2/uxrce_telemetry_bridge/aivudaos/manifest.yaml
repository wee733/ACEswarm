app_id: uxrce_telemetry_bridge
name: PX4 uXRCE Telemetry Bridge
version: 0.2.2-px4-v1.17-main-vs5
description: '将 PX4 uXRCE-DDS (px4_msgs: VehicleStatus v5 / VehicleLocalPosition v1 / BatteryStatus v1 / VehicleAttitude v0) 转换为地面站统一遥测 (telemetry/*, ENU) 及机间标准 Odometry。不兼容旧版 PX4 v1.14/v1.15 无后缀消息。适配 TrajectorySetpoint v0。'
run:
  entrypoint: ./start.sh
  args: []
default_config_path: ./config/default_config.yaml
config_schema_path: ./config/config_schema.yaml
